<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/aajneeti-favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aajneeti Reporting Dashboard</title>
  <!-- "/" is now the public reporting intro for signed-out visitors, so the
       root document carries the marketing description for crawlers. -->
  <meta name="description"
    content="One dashboard to track every project, manage Meta campaigns and show clients exactly where their budget went — leads, CPL and spend, live." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Manrope is the landing page's display face, and ONLY the landing page's.
       It used to be @imported from inside reporting-intro.css, which meant the
       browser couldn't even discover it until that stylesheet had downloaded
       and parsed — a second round trip in front of the first paint. Requesting
       it here instead removes that chain.

       `media="print"` keeps it from blocking render; the onload flips it to
       `all` once it lands. Deliberately a separate tag from the Inter link
       above rather than one combined request: Inter is the whole app's body
       face and its loading behaviour stays exactly as it was. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
